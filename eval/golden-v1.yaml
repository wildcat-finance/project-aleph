# Project Aleph — golden question set, v1
#
# Rebuilt from real transcripts: ~2,940 messages across five channels
# (public Telegram reachout, three borrower groups, one Slack channel with a
# market maker), Feb 2025 – Aug 2026. 500 question-bearing messages extracted,
# clustered, and reduced to the recurring shapes below.
#
# Supersedes golden-v0.yaml, which was written by guessing. Roughly a third of
# v0 survived contact with the data. What v0 got wrong is at the bottom under
# `what_v0_missed`.
#
# Question text is lightly normalised: typos left where they carry the register,
# borrower and market names replaced with <borrower> / <market>.
#
# corpus_gap marks questions that are real and recurring but have no answer in
# v2-protocol/docs. They are documentation work, not retrieval work, and are
# excluded from retrieval scoring by embed_compare.py.
#
# expected values:
#   corpus        — answer from pinned corpus, with citation
#   live          — answer from gateway, with block number and pinned release
#   corpus+live   — mechanism from corpus, current values from live state
#   correct       — the premise is wrong; correcting it IS the answer
#   refuse        — decline, offer escalation, no attempt
#   refuse+point  — decline, but name the right destination
#   triage        — gather the one detail a human will need, then hand off

meta:
  version: 1
  sources: 5 anonymised channels, 2,940 messages, 500 questions extracted
  period: 2025-02-13 – 2026-08-05
  count: 125
  corpus_gaps: '9 questions marked corpus_gap: real, recurring, and unanswerable from v2-protocol/docs.
    These are documentation work, not retrieval work — no embedding model can fix them. Excluded
    from retrieval scoring.'
questions:

  # ====================================================================
  # A. Withdrawal lifecycle — the largest single cluster by a distance
  # ====================================================================
- id: a01
  question: I withdrew once. Why is not all of my balance claimable the same day?
  expected: corpus+live
  frequency: very_high
  note: 'The single most repeated lender question in the entire dataset, in many phrasings.
    Partial claimability is normal and has three separate possible causes: request landed
    mid-cycle, batch not yet fully funded, or the market state needs updating. Aleph must
    distinguish, not guess.

    '
- id: a02
  question: When will I be able to claim?
  expected: corpus+live
  frequency: very_high
- id: a03
  question: When do the withdrawal cycles happen? Do the <borrower> pools process withdrawals
    at a rough time every 24 hours?
  expected: corpus
  frequency: high
  answer_shape: 'Cycles are not on a clock. A cycle starts when a lender requests a withdrawal;
    its length is a per-market parameter. The borrower then has that window to fund the batch.

    '
  note: Near-universal misconception that cycles are scheduled.
- id: a04
  question: How is the start and end of that cycle decided?
  expected: corpus
  frequency: high
  note: Direct follow-up to a03 in the transcript. Ship them as a pair.
- id: a05
  question: How do I check how many hours are left in the ongoing cycle for a market that
    doesn't show it in the UI?
  expected: corpus+live
  frequency: medium
- id: a06
  question: What's the difference between ongoing and claimable?
  expected: corpus
  frequency: high
  answer_shape: 'Ongoing is the amount requested in the current cycle. Claimable is allocated
    from previous cycles and not yet collected. Neither needs borrower action — only "outstanding
    from previous cycles" does.

    '
  note: Asked by borrowers and lenders both, about the same screen.
- id: a07
  question: Does the amount requested for withdrawal keep earning APR? When does that stop
    — at request, at end of cycle, or at claim?
  expected: corpus
  frequency: high
  answer_shape: 'Interest stops accruing when the withdrawal cycle starts. A request made
    during an ongoing cycle has its interest adjusted back to the start of that cycle.

    '
  note: 'This is the scale-factor batch behaviour in plain language. Same mechanic as b01
    below, arriving from a completely different direction.

    '
- id: a08
  question: I queued 1,000 <market token> and got less than 1,000 back. That invariant is
    broken by default, isn't it?
  expected: corpus
  frequency: low
  register: adversarial_technical
  answer_shape: 'Documented and intentional. Interest earned on scaled tokens in a batch is
    shared evenly across the batch, so a late joiner to an existing batch is credited from
    the batch''s start. Known Issues covers it.

    '
  note: 'From a real integrator who escalated over several hours, increasingly annoyed, arguing
    it was fundamentally broken. Aleph must hold the line politely with a citation and not
    concede to persistence. Highest-value single test in the file for tone under pressure.

    '
- id: a09
  question: Would we have earned more if we'd waited for a fresh batch? Is that a design choice?
  expected: corpus
  frequency: low
  note: Same thread as a08. Answer is yes, and yes, and it's documented.
- id: a10
  question: How do I ping the market?
  expected: corpus
  frequency: medium
  note: 'Lenders learn this term from the team and repeat it. Directly relevant to the Hydra:
    this is the manual poke that automation would remove.

    '
  corpus_gap: operational term, not in protocol docs
- id: a11
  question: Can you bump my withdrawal? Only part of it is claimable.
  expected: triage
  frequency: high
  note: 'An action request, not a question. Aleph cannot execute today. Until Hydra exists
    this is triage-and-hand-off, and it is one of the highest-volume asks in the borrower
    channels.

    '
- id: a12
  question: What happens to outstanding withdrawals after the cycle has ended?
  expected: corpus
  frequency: medium
- id: a13
  question: What happens if funds aren't repaid before the batch expires?
  expected: corpus
  frequency: medium
- id: a14
  question: After initiating a withdrawal, what's the best way to let the borrower know they
    have one to process?
  expected: corpus+live
  frequency: medium
  note: Points at the notifications bot, not at a person.
- id: a15
  question: We have a withdrawal request of $105k but still have $183k of borrowing capacity,
    and the market shows healthy. Do I need to repay, or does it net off?
  expected: corpus
  frequency: medium
  answer_shape: Nothing to do — undrawn capacity covers it.
  note: Borrower-side. Real question, real relief when answered.
- id: a16
  question: The remainder has to wait for the next cycle, ~2hrs?
  expected: corpus+live
  frequency: medium
- id: a17
  question: Why are the unlent funds not used to satisfy withdrawal requests?
  expected: corpus
  frequency: low
- id: a18
  question: What does it mean when part of the total debt is 'locked'?
  expected: correct
  frequency: low
  note: 'Real answer began "that''s not a term the UI uses" — the correct move is to ask what
    they''re looking at rather than invent a definition. Excellent abstention test: the plausible
    answer is the wrong one.

    '

  # ====================================================================
  # B. Interest and capacity — the most expensive misconception in the data
  # ====================================================================
- id: b01
  question: Yield is paid on total deposits, not total lent, right? If there's 4m deposited
    and only 3m borrowed, the borrower pays interest on the full 4m?
  expected: corpus
  frequency: high
  answer_shape: Correct. Interest accrues on lender deposits, not on drawn capital.
  note: Asked by lenders as a check and by borrowers as a horrified discovery.
- id: b02
  question: So we've been paying interest on the full 20m balance for months despite paying
    back half?
  expected: corpus
  frequency: medium
  register: angry
  answer_shape: 'Interest accrues on what lenders have deposited and not withdrawn. Repaying
    reduces what is drawn; it does not remove lender deposits. Capacity reduction limits new
    deposits, it does not evict existing ones. Exit is via the withdrawal queue or by closing
    the market.

    '
  note: 'The single most consequential misunderstanding in the whole dataset, and it surfaced
    months late and expensively. Aleph answering this correctly on day one is most of the
    business case. Tone matters — the asker is angry and is not wrong to be.

    '
- id: b03
  question: What does 'reduce capacity' actually do, and how should we use it?
  expected: corpus
  frequency: medium
  answer_shape: 'Caps total deposits. Setting capacity below current supply does not force
    anyone out; it prevents deposits that would exceed the cap.

    '
  note: Borrowers were reducing capacity after every repayment believing it stopped interest.
- id: b04
  question: The only way to stop paying interest on the entire balance is to pay back the
    entire thing?
  expected: corpus
  frequency: medium
- id: b05
  question: But the term of the loan is finished?
  expected: corpus
  frequency: medium
  answer_shape: A fixed term that ends converts to open term until the borrower closes the
    market.
- id: b06
  question: After a fixed term market ends and converts to open term, does the lending rate
    stay the same or can it change?
  expected: corpus
  frequency: medium
- id: b07
  question: Why can't we just force lenders out after repaying?
  expected: corpus
  frequency: low
  answer_shape: 'That would permit preferential repayment of some lenders over others. Exit
    is via the queue or market closure.

    '
  note: The design rationale matters more than the rule here.
- id: b08
  question: Is this the total to repay to close out the market, or is it the larger figure?
    Does it include interest?
  expected: corpus+live
  frequency: medium
- id: b09
  question: Do we deposit the protocol fee figure or the total interest figure?
  expected: corpus+live
  frequency: low
  note: Came with a screenshot of two numbers. Aleph must ask which market rather than pick.
- id: b10
  question: I thought market rates were immutable — someone said <borrower> adjusted theirs?
  expected: correct
  frequency: low
  answer_shape: 'APR is not immutable. Borrowers can change it within constraints; reductions
    beyond a threshold trigger a reserve ratio response.

    '
- id: b11
  question: Can the borrower change the withdrawal cycle duration without telling lenders?
  expected: corpus
  frequency: low
  note: 'Trust-shaped question. Answer is mechanical and should stay mechanical — what is
    changeable, what is on chain, what is observable.

    '
- id: b12
  question: If we want to change the withdrawal cycle, is deploying a new market the only
    way?
  expected: corpus
  frequency: low
- id: b13
  question: Do we only earn interest on the initial deposit, not on the claimable balance?
    The token balance grows with APR — how do I reconcile that with rates being auto-compounding?
  expected: corpus
  frequency: low
  note: Precise, technically literate, and the answer must not fudge.
- id: b14
  question: If I keep 100k in the market for two months and withdraw, is there an exit fee?
  expected: corpus
  frequency: low
- id: b15
  question: Is there a way to generate a CSV of amounts borrowed, repaid and interest for
    the year?
  expected: refuse+point
  frequency: medium
  note: 'Accounting and audit request, appears in more than one borrower channel. Aleph should
    not assemble financial statements. Point at the export path.

    '
  corpus_gap: accounting export, not documented

  # ====================================================================

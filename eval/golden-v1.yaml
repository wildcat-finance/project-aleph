  frequency: high
  answer_shape: State plus configured grace period plus time remaining. Facts only.
  note: 'Real answer in the data: "they have a 336 hour grace period and still have 165 hours
    to resolve it." Renderable, unemotional, complete. Aim for that.

    '
- id: c04

what_v0_missed:
- 'Volume is not where I guessed. The largest single category in the public channel is not
  protocol questions at all — it is BD outreach, partnership requests, job applications, listing
  pitches and token speculation. If Aleph only deflected those it would already be earning
  its keep.

  '
- 'UI troubleshooting is enormous and mostly outside Aleph''s reach. The value is in collecting
  the same four details a human always asks for, not in fixing anything.

  '
- '"Bump my withdrawal" is a request for an action, not an answer. v0 had no category for
  this and it is one of the highest-volume borrower asks.

  '
- 'The interest-on-deposits-not-drawn-capital misconception is the most expensive misunderstanding
  in the data, and it surfaced months late. v0 didn''t contain it at all.

  '
- 'Register matters as much as content. The same question arrives calm, worried, angry or
  adversarial, and the angry version is where a wrong tone does real damage. v0 had no notion
  of register.

  '
- 'Live phishing is present in the channel. Aleph will be asked to validate links and identities,
  and getting that wrong is worse than any protocol error it could make.

  '
- 'Several questions are two questions — one answerable, one not. Splitting them rather than
  answering the easy half is its own skill.

  '

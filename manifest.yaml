# Project Aleph — corpus manifest
#
# This file is the single source of truth for what gets indexed. The prose in
# aleph-ingestion-manifest.md explains *why*; this file is what CI actually reads.
# If the two disagree, this file wins and the prose is a bug.
#
# Anything not listed here is not ingested. There is no crawl mode.

version: 1

policy:
  scope:
    chains: [1]                    # Ethereum mainnet only
    # Everything else — other mainnets and every testnet — is out of scope:
    # not ingested, not queried, not answerable. A market answer drawn from the
    # wrong chain is indistinguishable from a right one until someone acts on it.
    other_chains: excluded
    testnets: excluded
  branches: never                  # every source resolves to an immutable ref
  rebuild: full                    # no incremental indexing, ever
  self_ingestion: forbidden        # this repo is never a source for Aleph

embedding:
  # Part of the corpus identity: changing it changes every answer with no
  # source-side diff to explain why. Treat a change as a rebuild + eval run.
  model: bge-m3
  digest: "790764642607"      # short id from `ollama list`, 2026-08-10; tags are mutable, this is not
  dimensions: 1024
  size_on_disk: 1.2GB
  parameters: 566.70M
  architecture: bert
  quantization: F16           # not quantised down — no retrieval quality lost to it
  max_context: 8192
  query_prefix: none            # bge-m3 is instruction-free; do not add one
  decided: 2026-08-10
  evidence: >
    87 chunks, 52 questions, 25 labelled. recall@1 20/25 vs qwen3-embedding:0.6b
    18/25 and :8b 17/25; 28 distinct chunks in first place vs 25 and 25. qwen
    0.6b won recall@5 by one question, which is inside the noise of a 25-question
    set. Decisive factor was non-statistical: bge-m3 performs as documented,
    whereas qwen 0.6b only performs with its documented instruct prefix REMOVED,
    which breaks silently on repackaging. See eval/RUNBOOK.md §6a.
  context_headroom: >
    Measured after Solidity chunking, not assumed: 962 chunks at v2.1.0, median
    175 chars, p99 2,292, max 5,062 — roughly 1,700 tokens against a limit of
    8,192. The earlier concern that contract chunks with full natspec would
    exceed bge-m3's context was speculation and is wrong. The check stays in
    chunk_solidity.py to notice if that ever changes.
  markdown_headroom: >
    Measured at wildcat-docs@21e7db2, not assumed: 545 chunks across 64
    documents, median 510 chars, p99 3,793, max 9,524 — roughly 3,200 tokens
    against a limit of 8,192. Prose sections are longer than Solidity chunks,
    as expected, and still less than half the budget.
  revisit_when: >
    A single chunk of either kind starts approaching the limit, or the corpus
    gains a source whose sections are longer than documentation prose. Neither
    is close today, and both chunkers refuse to emit a chunk that exceeds the
    limit rather than letting the embedder truncate it silently.

sources:

  - id: v2-protocol
    tier: A
    repo: wildcat-finance/v2-protocol
    ref:
      kind: annotated_tag
      tag: v2.1.0
      tag_object: 8aab396          # annotated tag object — NOT SIGNED, see below
      commit: c7be403              # resolve only after signature verifies
      # Kept true deliberately, and currently unmet: v2.1.0 is an annotated
      # tag carrying no signature at all, and v2.0.0 is lightweight. The first
      # build that actually ran `git verify-tag` — ingest/build.py, 2026-08 —
      # found this. Until a tag is signed, every build of this source needs
      # --allow-unverified-signature, which records the gap in build.json.
      # The tag object and commit hashes above are still asserted on every
      # build, so the corpus is pinned to exact objects; it is not attested to
      # a signer, and the "trust boundary is the signature" argument in
      # aleph-ingestion-manifest.md §5 does not currently hold.
      require_signature: true
    # The public name of this protocol, and the only one an answer may use.
    # The repository distinguishes a v2.1.0 *tag*; Wildcat does not publish a
    # "v2.1" and never refers to one. The tag is a reproducibility handle and
    # belongs in source_ref, not in anything a reader sees. v2.5 is different:
    # that one will be publicly distinguished, so it keeps its own name.
    protocol_version: "v2.0"
    deployment_status: deployed
    include:
      - "src/**/*.sol"
      - "docs/**/*.md"
      - "README.md"
      - "TESTS.md"
      - "EIP-4626_audit_scope.md"
    exclude:
      - "test/**"
      - "**/*.t.sol"
      - "script/**"
      - "scripts/**"
      - "lib/**"                   # git submodules
      - ".github/**"
    verification_only:             # not chunked as markdown; see solidity_chunking
      - "deployments/mainnet/deployments.json"

    # Solidity is chunked from the deployment verification inputs rather than
    # from the working tree: they carry the full source set and the exact
    # compiler settings behind the verified bytecode, so chunks describe
    # deployed code by construction. Pass every input — inheritance resolves
    # within one compilation unit, and the hooks instances are deployed
    # separately from the market.
    solidity_chunking:
      tool: ingest/chunk_solidity.py
      inputs: "deployments/mainnet/*/standard-input.json"
      solc: "0.8.25"               # matches foundry.toml at this tag
      solc_image: "ethereum/solc@sha256:231d46593eae6105dbb9a1225d318c9605a4e353e10371fe28ccce291be8ea35"
      solc_runner: ingest/solc-container
      # Containerised for reproducibility first, confinement second. A pinned
      # image digest makes the AST byte-identical on a laptop, in CI, and on a
      # replacement machine years from now — which is the premise of "same
      # manifest, same corpus". solc-select does not give that.
      #
      # The security case is real but smaller than it looks: ingestion is from
      # signed tags only, so anyone able to put hostile Solidity in front of
      # this compiler can already sign a tag and has better options than a solc
      # exploit. The trust boundary is the signature. Given that, confinement
      # is defence in depth rather than the control — but it costs nothing, and
      # --network none carries most of the value, since a compiler that cannot
      # open a socket cannot exfiltrate whatever it just parsed.
      include:
        - "src/**"
        - "lib/solady/src/auth/Ownable.sol"
      # Note the distinction from the `exclude: lib/**` above. That rule is
      # about ingesting unpinned submodules from the working tree. Library code
      # arriving *inside* a standard-input.json is pinned by construction — it
      # is part of the verified bytecode. Only three external files appear
      # across all five inputs, and only one carries answerable behaviour:
      #   Ownable.sol      18 chunks exposed by WildcatArchController —
      #                    owner(), transferOwnership, ownership events. This
      #                    is where "who controls the archcontroller" lives.
      #   EnumerableSet    29 chunks, zero exposure (used via `using for`,
      #                    not inherited), generic and widely known. Excluded.
      #   LibBit           bit arithmetic, no answerable behaviour. Excluded.
      #
      # src/libraries/ is the largest single bucket in the tree — 154 functions
      # against 89 in src/access and 70 in src/market. MarketStateLib, FeeMath,
      # WithdrawalLib and MathUtils are where liquidityRequired(), the scale
      # factor and the delinquency maths actually live. Covered by src/**.
    always_cite:
      - "docs/Known Issues.md"     # volunteered, not merely retrievable

  - id: v2-protocol-prerelease
    tier: A
    index: separate                # never merged into the main Tier A index
    repo: wildcat-finance/v2-protocol
    ref:
      kind: commit
      branch_of_origin: release/v2.5
      commit: dec36d2              # snapshot; re-snapshot deliberately
      require_signature: false
    protocol_version: "v2.5"
    deployment_status: not_deployed
    audited: false
    retrieval:
      requires_explicit_version: true   # only answers when asker names v2.5
      preamble: mandatory               # states unaudited + undeployed
      satisfies_general_questions: false
    include: [ "src/**/*.sol", "docs/**/*.md" ]
    exclude: [ "test/**", "**/*.t.sol", "script/**", "scripts/**", "lib/**", ".github/**" ]

  - id: wildcat-docs
    tier: B
    repo: wildcat-finance/wildcat-docs
    ref:
      kind: tag
      tag: aleph-v0.2
      commit: 21e7db2
      lightweight: true            # no tag object, so nothing to sign — see notes
      require_signature: false
      supersedes: aleph-v0.1 / 6c94fb3
    notes: >
      Content is human-written. The llm-rewrite-clean branch added agent
      navigation files, not agent-generated prose, so a Tier B citation still
      means reviewed documentation. docs-tg-bot documents the separate
      wildcat-notifications event bot, not this project. Both branches since
      deleted; AGENTS.md/CLAUDE.md live on the default branch and stay excluded.
      The aleph-v0.x tags are lightweight: they pin a commit, but carry no
      signature, so docs promotion has no cryptographic gate the way v2-protocol
      does. Ref immutability is by convention here — never move a tag, cut the
      next one.

      Since aleph-v0: the deprecated V1 tree is unpublished at source (so the
      exclusion below is now belt-and-braces rather than the only defence), two
      pages recovered that had existed only in GitBook, and the ?ask
      documentation corrected.

      Since aleph-v0.1: the FAQ rewritten and expanded from 4 headings to 31,
      and a page added for the downloadable market CSV exporter. The FAQ
      rewrite retires three anchors — the same questions survive under new
      wording, so the content is intact but any citation held against the old
      fragments will not resolve. That is what a docs promotion does, and it is
      the reason answers name the corpus build that produced them.

      The exporter ships as `using-wildcat/wildcat-market-csv.skill`, a zip
      containing agent instructions, sitting outside `skills/**`. It is not
      ingested because `include` is an allowlist of `**/*.md` and a `.skill`
      file cannot match it — the allowlist is the control, not the exclude
      list. It is named below anyway, so that broadening the include one day is
      a decision rather than an accident.
    include:
      - "**/*.md"
    exclude:
      - "SUMMARY.md"               # consumed as hierarchy, not as content
      - "AGENTS.md"                # instruction files aimed at agents — see below
      - "CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "skills/**"                # SKILL.md is the same class: written to be obeyed
      - "**/*.skill"               # packaged skills: instruction bundles, wherever they sit
      - "miscellaneous/deprecated-documentation/**"
      # 17 of 82 files describe superseded V1 internals. They self-identify —
      # "this page has not been updated to reflect Wildcat V2" — but only in
      # prose a retriever will happily ignore. A fifth of the docs corpus
      # answering confidently about behaviour that no longer exists is a worse
      # failure than having no answer.
      # These are prose whose entire purpose is to direct an agent's behaviour.
      # They may inform the ingestion pipeline as structure hints; they must never
      # enter the model's context, where they are indistinguishable from
      # instructions Wildcat intended Aleph to follow.
    metadata_required: [ doc_version, effective_date ]

live_state:
  # Not a corpus. Read at query time, never embedded, never cached into the index.
  transport: wildcat-data-gateway
  status: public_staging           # no production SLA — fail closed, never fall back
  rpc: "https://rpc.wildcat.finance/1"       # Ethereum mainnet only
  graph: "https://graph.wildcat.finance/{network}/{release}"
  health: "https://graph.wildcat.finance/health"     # unauthenticated
  auth:
    scheme: bearer
    env: ALEPH_GATEWAY_TOKEN       # dedicated to Aleph, not the frontend's
  pinned_releases:
    mainnet: "v2.0.30"             # v2.0.26 also live — pin, never auto-select
  required_in_every_answer:
    - "_meta { block { number } }"
  lag_gate:
    check: health_before_answering
    on_lag: decline                # never serve stale numbers as current

addresses:
  # Authoritative source is the published SDK artefact, not any repository.
  source: "npm:@wildcatfi/wildcat-sdk"
  pinned_version: "3.1.17"
  resolve_by: key                  # never by human-readable name
  assertions:
    # Build fails if these move. Three addresses have carried the name
    # "MarketLens"; the production one is not under the MarketLens key.
    MarketLensV2: "0xfDA5C5B96bb198D2fca1A01d759620B64Ae5afE7"
    WildcatArchController: "0xfEB516d9D946dD487A9346F6fee11f40C6945eE4"
    HooksFactory: "0xdd7dd3b5076Cf89440d05585FF56d246386207BE"
    WildcatSanctionsSentinel: "0x437e0551892C2C9b06d3fFd248fe60572e08CD1A"
    Wildcat4626WrapperFactory: "0xEA6DE11f8F3F83c79bD9d8Db5517fCFDf2Bb148a"
  never_use:
    - key: MarketLens
      address: "0xf1D516954f96c1363f8b0aE48D79c8ddE6237847"
      reason: legacy lens; live but superseded
    - source: "v2-protocol:deployments/mainnet/deployments.json"
      key: MarketLens
      address: "0xC672760757da93B5f3275dc97203D145806dae33"
      reason: stale in-repo book

excluded_repos:
  - repo: wildcat-finance/wildcat-juris
    reason: >
      Claim-intake for defaulted markets — lender contact details, country,
      signed claims. Defaults and claims route to a human unconditionally.
  - repo: wildcat-finance/wildcat.ts
    reason: >
      SDK source, main at 3.0.54-beta against published 3.1.17. Provenance only;
      address and ABI truth comes from the npm artefact.
  - repo: wildcat-finance/wildcat-app-v2
    reason: frontend; describes UI behaviour, not protocol behaviour
  - repo: wildcat-finance/subgraph
    reason: >
      Live-state schema, main at 2.0.22 against deployed 2.0.30. networks.json
      is a useful cross-check for start blocks, not an answer source.
  - repo: wildcat-finance/wildcat-gateway
    reason: transport configuration, not protocol documentation

gates:
  # All blocking. A build that fails any of these does not swap.
  - signature_verified
  - address_assertions_hold
  - corpus_diff_reviewed
  - eval_not_regressed
